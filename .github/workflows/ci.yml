name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.lock"

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run ruff lint check
        run: ruff check .

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.lock"

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .

      - name: Run all deterministic unit tests
        run: pytest tests/unit -v

      - name: Build multi-stage Docker image
        run: docker build -t nyc311-pipeline:ci .

      - name: Verify non-root runtime UID
        run: |
          UID_OUTPUT=$(docker run --rm nyc311-pipeline:ci id -u)
          echo "Container runtime UID: $UID_OUTPUT"
          if [ "$UID_OUTPUT" -eq 0 ]; then
            echo "ERROR: Container runs as root (UID 0)!"
            exit 1
          fi
          test "$UID_OUTPUT" -eq 10001

      - name: Verify package import in container
        run: docker run --rm nyc311-pipeline:ci python -c "import nyc311_pipeline; from nyc311_pipeline.ingestion import ApiClient; from nyc311_pipeline.storage.migrations import discover_migrations; assert discover_migrations('/app/db/migrations'); print(f'nyc311_pipeline v{nyc311_pipeline.__version__} imports and migration assets verified')"

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: nyc311
          POSTGRES_PASSWORD: test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyc311 -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.lock"

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .

      - name: Run database integration tests
        env:
          TEST_DATABASE_URL: postgresql://nyc311:test_password_only@localhost:5432/postgres
        run: pytest tests/integration -v
